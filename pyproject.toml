[project]
name = "ai-overlay"
version = "0.0.0"
description = "A customizable AI assistant overlay for Linux (Hyprland / Wayland)."
requires-python = ">=3.12"
# Runtime deps land here as code is written (docs/spec.md): the OpenAI-compatible
# `openai` client (LiteLLM proxy), `pillow` (downscale screenshots), and `textual`
# (the TUI, Milestone B). Each is added when a module first imports it, so the
# harness only carries what's in use. config.py needs none (stdlib tomllib).
dependencies = [
    "openai>=2.44.0",
    "pillow>=12.3.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pip-audit>=2.7",
]

[tool.ruff]
target-version = "py312"
# Vendored from llm-workflow and kept byte-identical, which the harness checker verifies
# by checksum. Formatting it here would put this copy permanently out of sync with the
# source it is checked against, so the file is excluded rather than reformatted. Anything
# this repo actually authors stays linted.
extend-exclude = ["scripts/md-unwrap.py"]

[tool.ruff.lint]
# Starter set: pyflakes (F), pycodestyle (E), isort (I), bugbear (B), pyupgrade (UP).
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app package lives at the repo root (run as `python -m ai_overlay`); put the
# root on sys.path so tests can `import ai_overlay` without an install step.
pythonpath = ["."]
