name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.0 # no moving v8 major tag published; pin exact
        with:
          enable-cache: true
      - run: uv sync
      - run: ./bin/ci

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Run the gitleaks CLI directly (same binary + rules as the local pre-commit hook)
      # instead of gitleaks-action, which needs a write token and posts PR comments —
      # noise for a private repo. Deterministic pass/fail, no permissions dance.
      - name: Secret scan (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact
